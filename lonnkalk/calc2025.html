<!DOCTYPE html>

<html class="no-js">
<!--<![endif]-->

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Lønnskalkulator 2025</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
        integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link rel="stylesheet" href="calc.css">
    <script src="//ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js"></script>
</head>

<body>

    <div class="container p-3 my-3 border">
        <div class="row justify-content-md-center">
            <div class="col-md-auto text-center">

                <form name="calcTariff">
                    <div class="custom-control custom-radio">
                        <label class="form-check-label" id="radiotitle" for="radio">Velg sektor</label><br />
                        <input class="form-control-input" type="radio" name="tariff" id="stat" value="stat">
                        <label class="form-check-label" for="stat">Stat</label>
                    </div>
                    <div class="custom-control custom-radio">
                        <input class="form-control-input" type="radio" name="tariff" id="kommune_ks" value="kommune_ks">
                        <label class="form-check-label" for="kommune_ks">Kommune KS</label>
                    </div>
                    <div class="custom-control custom-radio">
                        <input class="form-control-input" type="radio" name="tariff" id="privat_nho" value="privat_nho">
                        <label class="form-check-label" for="privat_nho">Privat NHO</label>
                    </div>
                    <div class="custom-control custom-radio">
                        <input class="form-control-input" type="radio" name="tariff" id="privat_itb" value="privat_itb">
                        <label class="form-check-label" for="privat_itb">Privat ITB</label>
                    </div>
                    <div class="custom-control custom-radio">
                        <input class="form-control-input" type="radio" name="tariff" id="privat_spekter_san" value="privat_spekter_san">
                        <label class="form-check-label" for="privat_spekter_san">Privat Spekter San</label>
                    </div>
                    <div class="custom-control custom-radio">
                        <input class="form-control-input" type="radio" name="tariff" id="privat_nho_abelia" value="privat_nho_abelia">
                        <label class="form-check-label" for="privat_nho_abelia">Privat NHO Abelia</label>
                    </div>
                    <div class="custom-control custom-radio">
                        <input class="form-control-input" type="radio" name="tariff" id="oslo_kommune" value="oslo_kommune">
                        <label class="form-check-label" for="oslo_kommune">Oslo kommune</label>
                    </div>
                    <div class="custom-control custom-radio">
                        <input class="form-control-input" type="radio" name="tariff" id="privat_virke" value="privat_virke">
                        <label class="form-check-label" for="privat_virke">Privat Virke</label>
                    </div>
                    <div class="custom-control custom-radio">
                        <input class="form-control-input" type="radio" name="tariff" id="kommune_ks_fjellstyrene" value="kommune_ks_fjellstyrene">
                        <label class="form-check-label" for="kommune_ks_fjellstyrene">Kommune KS Fjellstyrene</label>
                    </div>
                </form>

                <br>

                <form>
                    <label class="form-control-input" id="radiotitle" for="eduYear">Velg årstallet du fullførte din utdanning</label>
                    <div>
                        <span class="font-weight-bold text-primary ml-2 valueSpan2", id="demo"></span>
                        <br>
                        <input type="range" class="form-control-range" min="1978" max="2025" value="2000" class="slider"
                            id="eduYear" step="1">
                    </div>
                </form>

                <div class="arbeidserfaring"><span style="font-style:italic" id="exp"></span></div>

                <label class="form-check-label" id="salaryTitle" for="slr"></label><br />
                <p id="slr"></p>
            </div>
        </div>
    </div>

    <script src="calc2025.js"></script>
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"
        integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
        crossorigin="anonymous"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"
        integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
        crossorigin="anonymous"></script>

</body>

</html>
